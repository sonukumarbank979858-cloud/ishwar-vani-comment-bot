name: exch
on: {workflow_dispatch: {inputs: {code: {required: true}}}}
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CID: ${{ secrets.YT_CLIENT_ID }}
          CS: ${{ secrets.YT_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
        run: |
          curl -s https://oauth2.googleapis.com/token --data-urlencode "code=$CODE" --data-urlencode "client_id=$CID" --data-urlencode "client_secret=$CS" -d redirect_uri=http://127.0.0.1:8080 -d grant_type=authorization_code > t.json
          python3 -c "import json;d=json.load(open('t.json'));print('keys',list(d.keys()),d.get('error'),d.get('error_description'))"
          python3 -c "import json;print(json.load(open('t.json')).get('refresh_token',''))" > rt.txt
          openssl pkeyutl -encrypt -pubin -inkey iv_pub.pem -in rt.txt | base64 -w0; echo
